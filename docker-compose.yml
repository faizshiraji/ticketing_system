services:
  backend:
    build: .
    container_name: support_ticket_backend
    ports:
      # Host 8000 is already used by wc2026_api on this machine
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: support_ticket_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      # Empty so browser calls relative /api and Vite proxies to backend
      VITE_API_BASE_URL: ""
    depends_on:
      - backend
    restart: unless-stopped
